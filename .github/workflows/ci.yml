name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novabank" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-signing-key-that-is-long-enough
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://novabank:novabank@localhost:5432/novabank' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        if: matrix.database == 'sqlite'
        run: ruff check --config ruff.toml . ../e2e && ruff format --config ruff.toml --check . ../e2e
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed
        if: matrix.database == 'sqlite'
        run: |
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
          diff -u openapi.yaml /tmp/openapi.yaml || {
            echo "::error::openapi.yaml is out of date. Run: python manage.py spectacular --file openapi.yaml"; exit 1; }
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  stack:
    name: stack (docker compose + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: A signing key for this run only
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n/+=')" > .env
      - name: Build and start the whole bank
        run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke test through nginx (app, API, Mailpit, pacs.008)
        run: python3 e2e/smoke.py
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and remove everything
        if: always()
        run: docker compose down -v
