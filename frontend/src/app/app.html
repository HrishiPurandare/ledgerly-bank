<header class="topbar">
  <a routerLink="/" class="brand" data-testid="brand">NovaBank</a>
  @if (auth.isLoggedIn()) {
    <nav class="nav" aria-label="Main">
      <a routerLink="/accounts" routerLinkActive="active" data-testid="nav-accounts">Accounts</a>
      <a routerLink="/transfer" routerLinkActive="active" data-testid="nav-transfer">Send money</a>
      <a routerLink="/beneficiaries" routerLinkActive="active" data-testid="nav-beneficiaries"
        >Beneficiaries</a
      >
    </nav>
    <span class="who" data-testid="user-name">{{ auth.user()?.full_name }}</span>
    <button type="button" class="link" (click)="logout()" data-testid="logout">Log out</button>
  }
</header>
<router-outlet />
