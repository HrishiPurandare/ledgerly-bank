server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 1m;

    # The API, the Django admin and its static files: one origin for the browser, no CORS needed.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed file names (main-ABC123.js) never change content: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is the single-page app: /accounts/7 must return index.html, never a 404.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;  # always check for a new release
        try_files $uri /index.html;
    }
}
