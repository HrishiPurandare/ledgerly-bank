openapi: 3.0.3
info:
  title: Ledgerly Bank API
  version: 0.1.0
  description: Fictional banking API used as the system under test for a test-automation
    portfolio.
paths:
  /api/accounts/:
    get:
      operationId: accounts_list
      description: The logged-in customer's accounts.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: ''
  /api/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      description: 'One account. Someone else''s account is a 404, not a 403: we don''t
        even confirm it exists.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/transactions/:
    get:
      operationId: accounts_transactions_list
      description: The account's statement, newest first, with filters and pagination.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - ATM
          - BILL
          - CARD
          - FEE
          - INTEREST
          - SALARY
          - TRANSFER_IN
          - TRANSFER_OUT
        description: |-
          * `SALARY` - Salary
          * `TRANSFER_IN` - Transfer In
          * `TRANSFER_OUT` - Transfer Out
          * `CARD` - Card
          * `BILL` - Bill
          * `ATM` - Atm
          * `FEE` - Fee
          * `INTEREST` - Interest
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - CREDIT
          - DEBIT
        description: |-
          * `CREDIT` - Credit
          * `DEBIT` - Debit
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: max_amount
        schema:
          type: number
      - in: query
        name: min_amount
        schema:
          type: number
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Text in description or counterparty
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Email + password in, an access token (15 min) and a refresh token
        (1 day) out. Rate limited.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The logged-in customer's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Swap a refresh token for a new access token. The refresh token
        rotates on every use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a customer account. Open to anyone, rate limited.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/beneficiaries/:
    get:
      operationId: beneficiaries_list
      description: List beneficiaries, or add one. Adding emails a 6-digit OTP; it
        stays PENDING until confirmed.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - beneficiaries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBeneficiaryList'
          description: ''
    post:
      operationId: beneficiaries_create
      description: List beneficiaries, or add one. Adding emails a 6-digit OTP; it
        stays PENDING until confirmed.
      tags:
      - beneficiaries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BeneficiaryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BeneficiaryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
          description: ''
  /api/beneficiaries/{id}/:
    get:
      operationId: beneficiaries_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - beneficiaries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
          description: ''
    delete:
      operationId: beneficiaries_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - beneficiaries
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/beneficiaries/{id}/confirm/:
    post:
      operationId: beneficiaries_confirm_create
      description: Confirm a new beneficiary with the emailed code. Three wrong codes
        lock it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - beneficiaries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      description: Liveness and database check, for Docker and Kubernetes probes.
        Never needs a login.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/transfers/:
    get:
      operationId: transfers_list
      description: Your transfers, newest first. POST sends money.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - transfers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransferList'
          description: ''
    post:
      operationId: transfers_create
      description: Your transfers, newest first. POST sends money.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: A unique value per transfer (e.g. a UUID). A retry with the same
          key never pays twice.
        required: true
      tags:
      - transfers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: ''
  /api/transfers/{id}/:
    get:
      operationId: transfers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
          description: ''
  /api/transfers/{id}/pacs008/:
    get:
      operationId: transfers_pacs008_retrieve
      description: The ISO 20022 pacs.008 message for a transfer to another bank (XML).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - transfers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/xml:
              schema:
                type: string
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        iban:
          type: string
          readOnly: true
        iban_display:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        type_label:
          type: string
          readOnly: true
        nickname:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccountStatusEnum'
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - currency
      - iban
      - iban_display
      - id
      - nickname
      - opened_at
      - status
      - type
      - type_label
    AccountStatusEnum:
      enum:
      - ACTIVE
      - FROZEN
      type: string
      description: |-
        * `ACTIVE` - Active
        * `FROZEN` - Frozen
    Beneficiary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 140
        iban:
          type: string
          maxLength: 34
        iban_display:
          type: string
          readOnly: true
        nickname:
          type: string
          maxLength: 40
        status:
          allOf:
          - $ref: '#/components/schemas/BeneficiaryStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - activated_at
      - created_at
      - iban
      - iban_display
      - id
      - name
      - status
    BeneficiaryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
        iban:
          type: string
          minLength: 1
          maxLength: 34
        nickname:
          type: string
          maxLength: 40
      required:
      - iban
      - name
    BeneficiaryStatusEnum:
      enum:
      - PENDING
      - ACTIVE
      - LOCKED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACTIVE` - Active
        * `LOCKED` - Locked
    CategoryEnum:
      enum:
      - SALARY
      - TRANSFER_IN
      - TRANSFER_OUT
      - CARD
      - BILL
      - ATM
      - FEE
      - INTEREST
      type: string
      description: |-
        * `SALARY` - Salary
        * `TRANSFER_IN` - Transfer In
        * `TRANSFER_OUT` - Transfer Out
        * `CARD` - Card
        * `BILL` - Bill
        * `ATM` - Atm
        * `FEE` - Fee
        * `INTEREST` - Interest
    ConfirmRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - otp
    DirectionEnum:
      enum:
      - CREDIT
      - DEBIT
      type: string
      description: |-
        * `CREDIT` - Credit
        * `DEBIT` - Debit
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    KindEnum:
      enum:
      - OWN
      - INTERNAL
      - LOCAL
      type: string
      description: |-
        * `OWN` - Own
        * `INTERNAL` - Internal
        * `LOCAL` - Local
    PaginatedAccountList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    PaginatedBeneficiaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Beneficiary'
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PaginatedTransferList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionEnum'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        balance_after:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        description:
          type: string
          readOnly: true
        counterparty:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - balance_after
      - category
      - counterparty
      - created_at
      - description
      - direction
      - id
      - reference
    Transfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        uetr:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TransferStatusEnum'
          readOnly: true
        from_account:
          type: integer
          readOnly: true
        to_account:
          type: integer
          readOnly: true
          nullable: true
        beneficiary:
          type: integer
          readOnly: true
          nullable: true
        creditor_name:
          type: string
          readOnly: true
        creditor_iban:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        remarks:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - beneficiary
      - created_at
      - creditor_iban
      - creditor_name
      - currency
      - from_account
      - id
      - kind
      - reference
      - remarks
      - status
      - to_account
      - uetr
    TransferRequestRequest:
      type: object
      properties:
        from_account:
          type: integer
        to_account:
          type: integer
          description: One of your own accounts
        beneficiary:
          type: integer
          description: A confirmed beneficiary
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        remarks:
          type: string
          maxLength: 140
      required:
      - amount
      - from_account
    TransferStatusEnum:
      enum:
      - COMPLETED
      - PENDING
      type: string
      description: |-
        * `COMPLETED` - Completed
        * `PENDING` - Pending
    TypeEnum:
      enum:
      - CURRENT
      - SAVINGS
      - PREMIER
      type: string
      description: |-
        * `CURRENT` - Everyday Current Account
        * `SAVINGS` - Smart Savings Account
        * `PREMIER` - Premier Account
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - full_name
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
